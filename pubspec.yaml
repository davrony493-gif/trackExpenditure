name: track_expenses

description: "A new Flutter project."

publish_to: 'none'

version: 0.1.0+1

environment:

  sdk: ^3.11.4

dependencies:

  adaptive_theme: ^3.7.2

  animate_do: ^5.1.0

  audio_service: ^0.18.19
  audioplayers: ^6.7.1
  cupertino_icons: ^1.0.9
  device_info_plus: ^11.0.0
  file_picker: ^11.0.3
  flutter:

    sdk: flutter

  flutter_gen: ^5.15.0

 
  flutter_svg: ^2.3.0

  image_picker: ^1.2.3
  intl: ^0.20.3
  
  lottie: ^3.3.3
  native_glass_navbar: ^1.0.2
  open_file: ^4.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: 12.0.3
  provider: ^6.1.5+1
  share_plus: ^12.0.2
  sqflite: ^2.4.2+1
  url_launcher: ^6.3.2
  wakelock_plus: ^1.5.2

dev_dependencies:

  flutter_test:

    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo.png "
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"

  

flutter:

  uses-material-design: true

  assets:

    - assets/images/

    - assets/icons/

    - assets/lotties/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf