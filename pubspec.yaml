name: track_expenses

description: "A new Flutter project."

publish_to: 'none'

version: 0.1.0+1

environment:

  sdk: ^3.11.4

dependencies:

  adaptive_theme: ^3.7.2

  animate_do: ^5.1.0

  flutter:

    sdk: flutter

  flutter_gen: ^5.15.0

  flutter_svg: ^2.3.0

  native_glass_navbar: ^1.0.2

dev_dependencies:

  flutter_test:

    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.15.1

  flutter_gen_runner: ^5.15.0
  provider: ^6.1.5+1
  cupertino_icons: ^1.0.9

flutter:

  uses-material-design: true

  assets:

    - assets/images/

    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf